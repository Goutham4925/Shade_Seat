<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Shade Seat Advisor - Find Your Safe Seat</title>
    <meta name="description" content="Smart seat selection app for commuters. Get real-time recommendations on which side of the vehicle to sit to avoid direct sunlight. Uses GPS, compass, and sun position calculations." />
    <meta name="keywords" content="sun protection, commute app, seat advisor, sunlight avoidance, public transport, vehicle seating, sun position, GPS navigation, compass app, commuter tool" />
    <meta name="author" content="Shade Seat" />
    <meta name="theme-color" content="#0EA5E9" />
    <link rel="canonical" href="https://shadeseat.com/" />

    <!-- Link llm.txt for SEO / alternate resource -->
    <link rel="alternate" type="text/plain" href="public/llm.txt" title="Shade Seat App Documentation">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shadeseat.com/" />
    <meta property="og:title" content="Shade Seat Advisor - Find Your Safe Seat" />
    <meta property="og:description" content="Avoid direct sunlight on your commute. Get real-time seat recommendations based on sun position and travel direction." />
    <meta property="og:image" content="/sun-logo.png" />
    <meta property="og:site_name" content="Shade Seat Advisor" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shadeseat.com/" />
    <meta name="twitter:title" content="Shade Seat Advisor - Find Your Safe Seat" />
    <meta name="twitter:description" content="Smart seat selection tool that helps commuters avoid direct sunlight using GPS and sun position data" />
    <meta name="twitter:image" content="/sun-logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "Shade Seat Advisor",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "description": "Smart seat selection app that helps commuters choose the best side of a vehicle to avoid direct sunlight based on GPS location, compass heading, and real-time sun position calculations.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time sun position calculation",
        "GPS-based location detection",
        "Compass heading detection",
        "Route-based recommendations",
        "Manual direction selection",
        "PWA installable app"
      ],
      "screenshot": "/logo.png",
      "about": "Public transport commuters, rideshare passengers, and long-distance travelers looking to avoid direct sunlight exposure."
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="/global.css" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Favicon cache-buster -->
    <script>
      setTimeout(() => {
        const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/png';
        link.rel = 'icon';
        link.href = '/favicon.png?' + new Date().getTime();
        document.head.appendChild(link);
      }, 1000);
    </script>
  </body>
</html>
